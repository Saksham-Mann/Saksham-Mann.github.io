<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor | DVEL</title>
    <meta name="description" content="DVEL interactive code editor — write, run, and preview code right in your browser.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/badges.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="editor-body">
    <!-- Background WebGL Canvas — same hologram, very dim -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Navigation -->
    <header class="navbar">
        <nav class="nav-container" aria-label="Main navigation">
            <a href="index.html" class="logo" aria-label="DVEL Home">
                <span class="logo-text-full">Dynamic Virtual Education Lab</span>
                <span class="logo-text-short">DVEL</span>
            </a>
            <div class="nav-actions">
                <a href="#" class="nav-badges" aria-label="View Badges">
                    <span class="material-symbols-outlined" aria-hidden="true">workspace_premium</span>
                    <span class="badges-text">Badges</span>
                </a>
                <span class="nav-divider" aria-hidden="true"></span>
                <button class="btn-nav btn-auth-trigger" aria-label="Sign Up or Log In">Sign Up | Log In</button>
            </div>
        </nav>
    </header>

    <!-- Toolbar -->
    <div class="editor-toolbar" role="toolbar" aria-label="Editor controls">
        <div class="toolbar-left">
            <a href="courses.html" class="toolbar-back" title="Back to Courses" aria-label="Back to Courses">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                <span class="toolbar-back-text">Courses</span>
            </a>
            <span class="toolbar-sep" aria-hidden="true"></span>
            <div class="toolbar-course" aria-live="polite">
                <span class="material-symbols-outlined toolbar-course-icon" id="toolbar-course-icon" aria-hidden="true">code</span>
                <span class="toolbar-course-name" id="toolbar-course-name">Python Fundamentals</span>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="toolbar-btn toolbar-btn-run" id="btn-run" title="Run Code" aria-label="Run Code">
                <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
                <span>Run</span>
            </button>
            <button class="toolbar-btn toolbar-btn-live" id="btn-live-server" title="Toggle Live Server" aria-label="Toggle Live Server" style="display:none;" aria-pressed="false">
                <span class="material-symbols-outlined" aria-hidden="true">dns</span>
                <span>Live Server</span>
            </button>
        </div>
    </div>

    <!-- Main Editor Layout -->
    <div class="editor-layout" id="editor-layout">
        <!-- Editor Panel -->
        <div class="editor-panel" id="editor-panel">
            <div class="panel-header">
                <div class="panel-tab active">
                    <span class="material-symbols-outlined panel-tab-icon" id="editor-tab-icon">description</span>
                    <span id="editor-tab-name">main.py</span>
                </div>
                <div class="panel-header-actions">
                    <button class="panel-action-btn" id="btn-format" title="Format Code">
                        <span class="material-symbols-outlined">format_align_left</span>
                    </button>
                </div>
            </div>
            <div id="monaco-container"></div>
        </div>

        <!-- Resize Handle (visible in split mode) -->
        <div class="resize-handle" id="resize-handle">
            <div class="resize-grip"></div>
        </div>

        <!-- Right Side Panel (preview + terminal in split mode) -->
        <div class="right-panel" id="right-panel">
            <!-- Preview Panel -->
            <div class="preview-panel" id="preview-panel">
                <div class="panel-header preview-header">
                    <div class="panel-tab active">
                        <span class="material-symbols-outlined panel-tab-icon">language</span>
                        <span>Preview</span>
                    </div>
                    <div class="panel-header-actions">
                        <button class="panel-action-btn" id="btn-refresh-preview" title="Refresh Preview">
                            <span class="material-symbols-outlined">refresh</span>
                        </button>
                    </div>
                </div>
                <div class="preview-content">
                    <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin" title="Live Preview"></iframe>
                </div>
            </div>

            <!-- Terminal Panel (in right panel, bottom strip) -->
            <div class="terminal-split" id="terminal-split">
                <div class="panel-header terminal-header">
                    <div class="panel-tab active">
                        <span class="material-symbols-outlined panel-tab-icon">terminal</span>
                        <span>Terminal</span>
                    </div>
                    <div class="panel-header-actions">
                        <button class="panel-action-btn" id="btn-clear-terminal-split" title="Clear Terminal">
                            <span class="material-symbols-outlined">delete_sweep</span>
                        </button>
                    </div>
                </div>
                <div class="terminal-output" id="terminal-output-split"></div>
            </div>
        </div>

        <!-- Floating Terminal (default mode — bottom-right overlay) -->
        <div class="terminal-float" id="terminal-float">
            <div class="panel-header terminal-header terminal-float-header">
                <div class="panel-tab active">
                    <span class="material-symbols-outlined panel-tab-icon">terminal</span>
                    <span>Terminal</span>
                </div>
                <div class="panel-header-actions">
                    <button class="panel-action-btn" id="btn-clear-terminal-float" title="Clear Terminal">
                        <span class="material-symbols-outlined">delete_sweep</span>
                    </button>
                    <button class="panel-action-btn" id="btn-toggle-terminal" title="Minimize Terminal">
                        <span class="material-symbols-outlined">expand_more</span>
                    </button>
                </div>
            </div>
            <div class="terminal-output" id="terminal-output-float"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="js/badges.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
