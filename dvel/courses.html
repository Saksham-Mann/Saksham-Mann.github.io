<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | DVEL</title>
    <meta name="description" content="Browse all DVEL coding courses — Python, NumPy, Pandas, FastAPI, HTML, CSS, JavaScript and more.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/badges.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <!-- Navigation -->
    <header class="navbar">
        <nav class="nav-container" aria-label="Main navigation">
            <a href="index.html" class="logo" aria-label="DVEL Home">
                <span class="logo-text-full">Dynamic Virtual Education Lab</span>
                <span class="logo-text-short">DVEL</span>
            </a>
            <div class="nav-actions">
                <a href="#" class="nav-badges" aria-label="View Badges">
                    <span class="material-symbols-outlined" aria-hidden="true">workspace_premium</span>
                    <span class="badges-text">Badges</span>
                </a>
                <span class="nav-divider" aria-hidden="true"></span>
                <button class="btn-nav btn-auth-trigger" aria-label="Sign Up or Log In">Sign Up | Log In</button>
            </div>
        </nav>
    </header>

    <!-- Courses Page Body -->
    <main class="courses-page">

        <!-- Tall scroll stage — height drives GSAP animation -->
        <div class="spiral-stage" id="spiral-stage">

            <!-- Pinned viewport — stays on screen while stage scrolls -->
            <div class="spiral-viewport" id="spiral-viewport">

                <!-- Header -->
                <div class="courses-header">
                    <div class="badge-tag cyan-tag" style="display:inline-flex; margin-bottom:10px;">
                        <span class="material-symbols-outlined">menu_book</span> All Courses
                    </div>
                    <h1>Choose your path</h1>
                    <p>Scroll to explore — click any course to begin.</p>
                </div>

                <!-- Cards are placed here by JS with 3D transforms -->
                <div class="spiral-scene" id="spiral-scene"></div>

                <!-- Scroll nudge -->
                <div class="scroll-hint" id="scroll-hint">
                    <span class="material-symbols-outlined">expand_more</span>
                    Scroll to explore
                </div>

            </div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="js/badges.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
