<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background-color: #020204; /* Deep void color */
        }

        /* Fade the background into the void (black) at the bottom */
        .spatial-bg {
            opacity: 1 !important;
            background-image: url('/assets/lab_background.png') !important;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 95%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 95%);
        }

        .main-content {
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
            pointer-events: auto !important;
        }

        /* The glass container for 404 */
        .glass-container {
            position: relative;
            justify-content: center;
            align-items: center;
            height: 65vh;
            max-width: 1000px;
            padding: 0;
            overflow: hidden;
            /* Subtly darker glass for the void vibe */
            background: rgba(15, 15, 20, 0.6); 
            border-bottom: 1px solid var(--glass-border, rgba(255,255,255,0.1));
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        /* 2-column layout mirroring the image */
        .error-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 50px 70px;
            position: relative;
            z-index: 1; /* Above the cracks */
            gap: 20px;
        }

        .error-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .error-right {
            flex: 0.8;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .sub-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .error-msg {
            font-size: 4.2rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        .error-desc {
            color: var(--text-secondary);
            margin-bottom: 45px;
            max-width: 420px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .huge-404 {
            font-size: 15rem;
            font-weight: 800;
            color: transparent; /* Fallback for browsers that don't support text fill color */
            background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.05));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 0;
        }

        /* Adjust button to look a bit more like the image (dark with arrow) but keeping our gradient style */
        .github-cta {
            align-items: flex-start;
            margin-top: 0;
        }
        
        .primary-btn {
            padding: 16px 32px;
            border-radius: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .primary-btn svg {
            transition: transform 0.3s ease;
        }
        
        .primary-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .primary-btn:hover svg {
            transform: translateX(5px);
        }
        
        /* Media query for smaller screens */
        @media (max-width: 900px) {
            .error-layout {
                flex-direction: column;
                text-align: center;
                padding: 50px 30px;
                justify-content: center;
            }
            .error-left {
                align-items: center;
                text-align: center;
            }
            .error-right {
                justify-content: center;
                margin-top: -20px;
            }
            .huge-404 {
                font-size: 10rem;
            }
        }
    </style>
</head>

<body>
    <!-- Main Spatial UI -->
    <div class="spatial-bg"></div>
    <div class="main-content">
        <div class="glass-container">
            <div class="error-layout">
                <div class="error-left">
                    <div class="sub-text">404 Not Found</div>
                    <div class="error-msg">Lost in Space</div>
                    <div class="error-desc">
                        The design you are looking for has drifted into the void. It might have been removed, had its name changed, or is temporarily unavailable.
                    </div>
                    
                    <div class="github-cta">
                        <a href="/" class="primary-btn">
                            Back To Home
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </a>
                    </div>
                </div>
                
                <div class="error-right">
                    <div class="huge-404">404</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
