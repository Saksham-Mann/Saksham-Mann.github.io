<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #020204; /* Deep void color */
        }

        /* Fade the background into the void (black) at the bottom */
        .spatial-bg {
            opacity: 1 !important;
            background-image: url('assets/lab_background.png') !important;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 95%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 95%);
        }

        .main-content {
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
            pointer-events: auto !important;
        }

        /* The glass container with cracked effect at the bottom */
        .glass-container {
            position: relative;
            justify-content: center;
            align-items: center;
            height: 65vh;
            max-width: 1000px;
            padding: 0;
            overflow: hidden;
            /* Subtly darker glass for the void vibe */
            background: rgba(15, 15, 20, 0.6); 
            border-bottom: none; /* Removed bottom border where cracks will be */
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        /* SVG Cracks Overlay */
        .cracks {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.95;
        }

        /* 2-column layout mirroring the image */
        .error-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 50px 70px;
            position: relative;
            z-index: 1; /* Above the cracks */
            gap: 20px;
        }

        .error-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .error-right {
            flex: 0.8;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .sub-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .error-msg {
            font-size: 4.2rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        .error-desc {
            color: var(--text-secondary);
            margin-bottom: 45px;
            max-width: 420px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .huge-404 {
            font-size: 15rem;
            font-weight: 800;
            color: transparent; /* Fallback for browsers that don't support text fill color */
            background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.05));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 0;
        }

        /* Adjust button to look a bit more like the image (dark with arrow) but keeping our gradient style */
        .github-cta {
            align-items: flex-start;
            margin-top: 0;
        }
        
        .primary-btn {
            padding: 16px 32px;
            border-radius: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .primary-btn svg {
            transition: transform 0.3s ease;
        }
        
        .primary-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .primary-btn:hover svg {
            transform: translateX(5px);
        }
        
        /* Media query for smaller screens */
        @media (max-width: 900px) {
            .error-layout {
                flex-direction: column;
                text-align: center;
                padding: 50px 30px;
                justify-content: center;
            }
            .error-left {
                align-items: center;
                text-align: center;
            }
            .error-right {
                justify-content: center;
                margin-top: -20px;
            }
            .huge-404 {
                font-size: 10rem;
            }
        }
    </style>
</head>

<body>
    <!-- Main Spatial UI -->
    <div class="spatial-bg"></div>
    <div class="main-content">
        <div class="glass-container">
            <!-- SVG Cracks at the bottom -->
            <svg class="cracks" viewBox="0 0 1000 140" preserveAspectRatio="none">
                <!-- Jagged crack lines creeping up from the bottom (Void filling the cracks) -->
                <path d="M0,140 L0,100 L30,120 L60,80 L100,110 L140,50 L180,120 L220,40 L260,130 L300,30 L350,110 L400,20 L450,100 L500,60 L550,130 L600,40 L650,120 L700,50 L750,110 L800,20 L850,100 L900,40 L950,120 L980,80 L1000,110 L1000,140 Z" fill="#020204" opacity="1"></path>
                <path d="M0,140 L0,110 L45,130 L75,90 L120,120 L160,70 L200,135 L240,60 L280,135 L330,50 L380,125 L430,40 L480,115 L530,80 L580,140 L630,60 L680,130 L730,70 L780,125 L830,40 L880,115 L930,60 L970,135 L1000,120 L1000,140 Z" fill="#050508" opacity="0.8"></path>
                <!-- Glowing cracked edges of the glass -->
                <polyline points="0,100 30,120 60,80 100,110 140,50 180,120 220,40 260,130 300,30 350,110 400,20 450,100 500,60 550,130 600,40 650,120 700,50 750,110 800,20 850,100 900,40 950,120 980,80 1000,110" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"></polyline>
                <!-- Subtle cyan void glow emanating from the bottom -->
                <path d="M0,140 L1000,140 L1000,110 C800,110 700,60 500,60 C300,60 200,110 0,110 Z" fill="url(#void-glow)"></path>
                <defs>
                    <linearGradient id="void-glow" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0%" stop-color="rgba(0, 210, 255, 0.25)" />
                        <stop offset="100%" stop-color="rgba(0, 210, 255, 0)" />
                    </linearGradient>
                </defs>
            </svg>

            <div class="error-layout">
                <div class="error-left">
                    <div class="sub-text">404 Not Found</div>
                    <div class="error-msg">Oops! We couldn't<br>find that page.</div>
                    <div class="error-desc">
                        The page you're looking for has drifted into the void. Probably the link is broken or the page was removed.
                    </div>
                    
                    <div class="github-cta">
                        <a href="index.html" class="primary-btn">
                            Back To Home
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </a>
                    </div>
                </div>
                
                <div class="error-right">
                    <div class="huge-404">404</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
